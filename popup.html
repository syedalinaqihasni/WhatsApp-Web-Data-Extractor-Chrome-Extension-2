<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Data Extractor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.890-5.335 11.893-11.893A11.821 11.821 0 0020.484 3.688" fill="#25D366"/>
        </svg>
        <h1>WhatsApp Extractor</h1>
      </div>
    </header>

    <div class="status-indicator" id="statusIndicator">
      <div class="status-dot"></div>
      <span id="statusText">Checking WhatsApp Web...</span>
    </div>

    <div class="tabs">
      <button class="tab-button active" data-tab="chats">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Extract Chats
      </button>
      <button class="tab-button" data-tab="contacts">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Extract Contacts
      </button>
    </div>

    <div id="chatsTab" class="tab-content active">
      <div class="section">
        <h3>Chat Selection</h3>
        <div class="selection-options">
          <label class="radio-option">
            <input type="radio" name="chatSelection" value="current" checked>
            <span class="radio-custom"></span>
            Current Chat
          </label>
          <label class="radio-option">
            <input type="radio" name="chatSelection" value="selected">
            <span class="radio-custom"></span>
            Selected Chats
          </label>
          <label class="radio-option">
            <input type="radio" name="chatSelection" value="all">
            <span class="radio-custom"></span>
            All Chats
          </label>
        </div>
      </div>

      <div class="section">
        <h3>Chat Types</h3>
        <div class="checkbox-group">
          <label class="checkbox-option">
            <input type="checkbox" id="includeIndividual" checked>
            <span class="checkbox-custom"></span>
            Individual Chats
          </label>
          <label class="checkbox-option">
            <input type="checkbox" id="includeGroups" checked>
            <span class="checkbox-custom"></span>
            Group Chats
          </label>
          <label class="checkbox-option">
            <input type="checkbox" id="includeCommunities" checked>
            <span class="checkbox-custom"></span>
            Communities
          </label>
        </div>
      </div>

      <div class="section">
        <h3>Export Format</h3>
        <div class="checkbox-group">
          <label class="checkbox-option">
            <input type="checkbox" id="exportHTML" checked>
            <span class="checkbox-custom"></span>
            HTML Format
          </label>
          <label class="checkbox-option">
            <input type="checkbox" id="exportText" checked>
            <span class="checkbox-custom"></span>
            Text Format
          </label>
        </div>
      </div>

      <button id="extractChats" class="primary-button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7,10 12,15 17,10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Extract Chats
      </button>
    </div>

    <div id="contactsTab" class="tab-content">
      <div class="section">
        <h3>Contact Selection</h3>
        <div class="selection-options">
          <label class="radio-option">
            <input type="radio" name="contactSelection" value="all" checked>
            <span class="radio-custom"></span>
            All Contacts
          </label>
          <label class="radio-option">
            <input type="radio" name="contactSelection" value="groups">
            <span class="radio-custom"></span>
            Group Members Only
          </label>
        </div>
      </div>

      <div class="section">
        <h3>Export Format</h3>
        <div class="checkbox-group">
          <label class="checkbox-option">
            <input type="checkbox" id="exportCSV" checked>
            <span class="checkbox-custom"></span>
            CSV Format
          </label>
          <label class="checkbox-option">
            <input type="checkbox" id="exportVCF" checked>
            <span class="checkbox-custom"></span>
            VCF Format
          </label>
        </div>
      </div>

      <button id="extractContacts" class="primary-button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7,10 12,15 17,10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Extract Contacts
      </button>
    </div>

    <div id="progressSection" class="progress-section hidden">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">Extracting data...</div>
    </div>

    <div class="footer">
      <p>Make sure you're on WhatsApp Web before extracting data</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
